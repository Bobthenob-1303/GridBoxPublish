<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mechanical Typesetting</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 40px 20px;
        }

        .mtsimage {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            width: 100%;
            max-width: 900px;
            height: 450px;
        }

        .mtsimage-content {
           background-color: #2b2b2b;
            border-radius: 24px;
            overflow: hidden; 
            padding: 0;        
            display: flex;
        }

        .mtsimage-content img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            display: block;
        }

        .mtstext {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 40px;
            color: whitesmoke;
            font-family: "TypeMachine", sans-serif;
            background-color: #1a1a1a;
            border-radius: 20px;

            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease, background-color 0.3s ease;
        }

        .mtstext:hover {
            transform: translateY(+12px);
            background-color: black;
        }

        .mtstext h1 {
            font-size: 32px;
            margin-bottom: 16px;
        }

        .mtstext p {
            font-size: 16px;
            line-height: 1.6;
        }

        @media (max-width: 768px) {
            .mtsimage {
                grid-template-columns: 1fr;
                height: auto;
            }

            .mtsimage-content {
                height: 250px;
            }
        }
    </style>
</head>
<body>

    <div class="mtsimage">
        <div class="mtsimage-content">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcShksG_oLvyPOIFaASR4Ti1oi-iyUvAZ9-PiZGoKdZkAH7ZZ-iSxu06eII&s=10" alt="Mechanical Typesetting">
        </div>
        <div class="mtstext">
            <h1>Mechanical Typesetting</h1>
            <p>
                The most famous example was the Linotype machine, developed by Ottmar Mergenthaler in the 1880s.

Before Linotype, a typesetter had to take individual pieces of metal type and arrange them letter by letter and word by word to create a page.
            </p>
        </div>
    </div>

</body>
</html>
